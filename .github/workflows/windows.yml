name: Windows verification and packaging

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upgrade_from_tag:
        description: 'Optional reviewed previous version tag to build and upgrade from'
        type: string
        required: false
        default: ''
      checks_only:
        description: 'Run source verification without creating release artifacts'
        type: boolean
        default: false
      release_tag:
        description: 'Existing v* tag to build and publish; leave empty for normal runs'
        type: string
        required: false
        default: ''
      stable_evidence:
        description: 'Reviewed stable acceptance JSON matching this exact revision; required for final versions'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/setup-inno.ps1
      - name: Check tagged version
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v') { throw 'Release tag must start with v' }
          $version = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne "v$version") { throw 'Git tag and VERSION disagree' }
      - name: Prepare publisher-pinned FFmpeg test tools
        shell: pwsh
        run: ./scripts/setup-test-ffmpeg.ps1
      - name: Real FFmpeg and process-interruption checks
        shell: pwsh
        run: |
          $env:PHEEBKIT_INTEGRATION = '1'
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build optional previous-version upgrade candidate
        if: github.event_name == 'workflow_dispatch' && inputs.upgrade_from_tag != '' && !inputs.checks_only
        shell: pwsh
        env:
          PHEEBKIT_UPGRADE_FROM_TAG: ${{ inputs.upgrade_from_tag }}
        run: |
          # Historical v3 candidates are built only as isolated upgrade baselines.
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/prepare-upgrade-baseline.ps1 -Ref $env:PHEEBKIT_UPGRADE_FROM_TAG
      - name: Verify and package Windows x64
        if: ${{ !inputs.checks_only }}
        shell: pwsh
        env:
          PHEEBKIT_STABLE_EVIDENCE: ${{ inputs.stable_evidence }}
        run: |
          if ($env:PHEEBKIT_STABLE_EVIDENCE) {
            $evidencePath = Join-Path (Get-Location) '.tools/stable-evidence.json'
            $env:PHEEBKIT_STABLE_EVIDENCE | Set-Content -LiteralPath $evidencePath -Encoding utf8NoBOM
            ./scripts/release-windows.ps1 -StableEvidence $evidencePath
          } else {
            ./scripts/release-windows.ps1
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer lifecycle in an isolated directory
        if: ${{ !inputs.checks_only }}
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath '.tools/upgrade-baseline-path.txt') {
            ./scripts/verify-windows-release.ps1 -PreviousReleaseDirectory (Get-Content -LiteralPath '.tools/upgrade-baseline-path.txt' -Raw).Trim()
          } else {
            ./scripts/verify-windows-release.ps1
          }
      - name: Upload candidate artifacts
        if: ${{ !inputs.checks_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PheebKit-windows-x64
          path: release/*/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          $version = (Get-Content VERSION -Raw).Trim()
          $title = "PheebKit $version — Windows x64"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --title $title --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag release/$version/* --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version.Contains('-')) {
            gh release edit $tag --draft=false --prerelease
          } else {
            gh release edit $tag --draft=false --prerelease=false
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Finish checks-only verification
        if: inputs.checks_only
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend audit --audit-level=low
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($check in @('test', 'typecheck', 'lint', 'format:check')) {
            npm --prefix frontend run $check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node --test scripts/version.test.mjs scripts/stable-evidence.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/build-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary bin/PheebKit.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

# Produces reviewable candidates only. GitHub Releases publication remains a
# separate explicit owner action; Android is intentionally absent.
