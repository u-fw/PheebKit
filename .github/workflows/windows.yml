name: Windows verification and packaging

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/setup-inno.ps1
      - name: Check tagged version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Git tag and VERSION disagree' }
      - name: Verify and package Windows x64
        shell: pwsh
        run: |
          ./scripts/release-windows.ps1
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer lifecycle in an isolated directory
        shell: pwsh
        run: ./scripts/verify-windows-release.ps1
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PheebKit-windows-x64
          path: release/*/*
          if-no-files-found: error
          retention-days: 14

# Produces reviewable candidates only. GitHub Releases publication remains a
# separate explicit owner action; Android is intentionally absent.
