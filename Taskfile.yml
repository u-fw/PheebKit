version: '3'
vars:
  APP_NAME: PheebKit
  BIN_DIR: bin
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
tasks:
  bindings:
    cmds:
      - node scripts/sync-version.mjs
      - go mod tidy
      - wails3 generate bindings -ts -i -clean=true
  build:
    cmds:
      - task: bindings
      - task: build:frontend
      - wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out kompeg.syso
      - go build -tags production -trimpath -ldflags="-s -w -H windowsgui" -o bin/PheebKit.exe .
  build:frontend:
    dir: frontend
    cmds:
      - npm ci
      - npm run build
  build:dev:
    cmds:
      - task: bindings
      - wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out kompeg.syso
      - 'go build {{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}}{{end}} -buildvcs=false -gcflags=all="-l" -o bin/PheebKit-dev.exe .'
  dev:frontend:
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort
  run:
    cmds:
      - ./bin/PheebKit.exe
  run:dev:
    cmds:
      - ./bin/PheebKit-dev.exe
  build:server:
    cmds:
      - go build -tags server -o bin/PheebKit-server.exe .
  test:
    cmds:
      - node --test scripts/version.test.mjs
      - go test ./...
      - go vet ./...
      - npm --prefix frontend run test
      - npm --prefix frontend run lint
      - npm --prefix frontend run typecheck
      - npm --prefix frontend run format:check
