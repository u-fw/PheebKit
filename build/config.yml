version: '3'
info:
  companyName: kompeg
  productName: kompeg
  productIdentifier: studio.kompeg.app
  description: Local video processing workspace
  version: '0.1.0'
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, node_modules, frontend, bin, artifacts, _scaffold]
    file: ['*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 task build:dev
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
    - cmd: wails3 task run:dev
      type: primary
      exit_policy: shutdown
